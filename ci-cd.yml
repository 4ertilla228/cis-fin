name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd secondChance-backend
          npm install

      - name: Run linter
        run: |
          cd secondChance-backend
          npx eslint . --fix || true

      - name: Build and verify
        run: |
          echo "Build completed successfully!"
